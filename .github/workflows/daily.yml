name: daily-short

on:
  schedule:
    - cron: "30 3 * * *"      # every day 03:30 UTC (09:00 IST)
  workflow_dispatch:           # manual "Run workflow" button for testing

permissions:
  contents: write              # lets the workflow save data/state.json (which topic is next)

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Make today's video
        run: python run_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # optional

      - name: Save progress (next niche/topic)
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git commit -m "progress $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Keep the video for download
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: output/
          retention-days: 14
